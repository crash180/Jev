<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F33"/>
      <stop offset="1" stop-color="#123A52"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DD0C1"/>
      <stop offset="1" stop-color="#00897B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- network graph inside the lens -->
  <g stroke="#4DD0C1" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <line x1="168" y1="196" x2="232" y2="150"/>
    <line x1="232" y1="150" x2="290" y2="210"/>
    <line x1="168" y1="196" x2="206" y2="270"/>
    <line x1="206" y1="270" x2="290" y2="210"/>
  </g>
  <g fill="#E0F7F4">
    <circle cx="168" cy="196" r="20"/>
    <circle cx="232" cy="150" r="20"/>
    <circle cx="290" cy="210" r="20"/>
    <circle cx="206" cy="270" r="20"/>
  </g>
  <!-- lens ring and handle -->
  <circle cx="228" cy="212" r="132" fill="none" stroke="url(#lens)" stroke-width="34"/>
  <line x1="326" y1="312" x2="420" y2="406" stroke="url(#lens)" stroke-width="48" stroke-linecap="round"/>
</svg>
